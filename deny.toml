# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally: cargo deny check

[graph]
# Only the platforms Tonearm ships for; deps of other targets don't matter here.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec database: vulnerable crates fail, unmaintained ones are reported for direct deps.
version = 2
yanked = "deny"
unmaintained = "workspace"
# Every entry: why it does not apply or why it cannot be fixed here. Revisit on each librespot/slint bump.
ignore = [
    # rsa 0.9 (Marvin timing attack, no fixed 0.9.x): librespot-core uses it only to verify the
    # Spotify AP server signature (public-key operation); the attack needs private-key decryption.
    { id = "RUSTSEC-2023-0071", reason = "librespot-core 0.8: public-key verify only, no fix in 0.9.x" },
    # rustls 0.22 / rustls-webpki 0.102: only through librespot-core -> hyper-proxy2 -> hyper-rustls 0.26,
    # used when a proxy is configured in librespot (Tonearm never sets one). Fixed versions need
    # hyper-proxy2 to move to hyper-rustls 0.27 (upstream).
    { id = "RUSTSEC-2026-0049", reason = "librespot proxy path only (hyper-proxy2), unused" },
    { id = "RUSTSEC-2026-0098", reason = "librespot proxy path only (hyper-proxy2), unused" },
    { id = "RUSTSEC-2026-0099", reason = "librespot proxy path only (hyper-proxy2), unused" },
    { id = "RUSTSEC-2026-0104", reason = "librespot proxy path only (hyper-proxy2), unused; no CRLs parsed" },
    { id = "RUSTSEC-2026-0382", reason = "librespot proxy path only (hyper-proxy2), unused" },
    { id = "RUSTSEC-2026-0346", reason = "librespot proxy path only (hyper-proxy2), unused" },
    { id = "RUSTSEC-2026-0349", reason = "librespot proxy path only (hyper-proxy2), unused" },
    # quick-xml 0.38 in librespot-core parses XML only from Spotify's own servers over TLS.
    { id = "RUSTSEC-2026-0194", reason = "librespot-core 0.8, trusted Spotify XML only" },
    { id = "RUSTSEC-2026-0195", reason = "librespot-core 0.8, trusted Spotify XML only" },
    # chrono is also pulled in by i-slint-core, so dropping it from tonearm would not remove it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained; also required by slint" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Compatible with shipping an MIT-licensed binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

# Slint is GPL-3.0 OR Slint Royalty-free 2.0 OR commercial. Tonearm uses the Royalty-free license
# for desktop apps; its condition (attribution) is met by the "Made with Slint" badge in README.md.
[[licenses.exceptions]]
crate = "slint"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "slint-build"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "slint-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-renderer-femtovg"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

# webpki 0.22 ships an ISC LICENSE file but no `license` field in Cargo.toml.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
# librespot, slint and keyring pull different majors of the same crates (aes, hmac, digest,
# calloop...). That cannot be fixed here, but new duplicates should be visible in CI.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path (no version), which is fine for unpublished crates.
allow-wildcard-paths = true
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
