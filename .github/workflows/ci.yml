name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; only the release job may write (create the GitHub release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  test:
    name: tests
    uses: ./.github/workflows/tests.yml

  # Build and package in parallel with tests; release waits for both.
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
      # Last.fm API account built into release binaries (repository secrets; empty = no scrobbling).
      TONEARM_LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
      TONEARM_LASTFM_SECRET: ${{ secrets.LASTFM_API_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libasound2-dev
      - name: Release build
        run: cargo build --release --locked -p tonearm
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/tonearm-linux-x86_64.tar.gz -C target/release tonearm \
            -C "$GITHUB_WORKSPACE/packaging/arch" tonearm.desktop \
            -C "$GITHUB_WORKSPACE/assets" icon.svg \
            -C "$GITHUB_WORKSPACE" LICENSE
          # The bare binary is what the in-app updater downloads.
          cp target/release/tonearm dist/tonearm-linux-x86_64
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/tonearm.exe, README.md, LICENSE -DestinationPath dist/tonearm-windows-x86_64.zip
          # The bare exe is what the in-app updater downloads.
          Copy-Item target/release/tonearm.exe dist/tonearm-windows-x86_64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tonearm-${{ runner.os }}
          path: dist/*

  # Compile in the target distribution environment on every CI run.
  arch:
    name: build (archlinux container)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pacman -Syu --noconfirm --needed rust fontconfig libxkbcommon libxkbcommon-x11 wayland alsa-lib
      - run: cargo build --workspace --locked

  # pacman package for the in-app updater on Arch (pkexec pacman -U). Tags only.
  arch-package:
    if: startsWith(github.ref, 'refs/tags/v')
    name: package (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          pacman -Syu --noconfirm --needed rust gcc-libs glibc fontconfig freetype2 libxkbcommon \
            libxkbcommon-x11 wayland libx11 libxcursor libxi libxrandr alsa-lib
      - name: makepkg
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          su builder -c "makepkg --nocheck --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp tonearm-*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tonearm-arch
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, test, package, arch, arch-package]
    runs-on: ubuntu-latest
    # Keep UPDATE_SIGNING_KEY as an environment secret of "release" (with required reviewers),
    # so no other job or branch can read the key that every installed copy trusts.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches the version in Cargo.toml
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says ${want}; the app would offer itself as an update forever"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # Detached ed25519 signatures (64 raw bytes) for the in-app updater; the public key is
      # in crates/core/src/update.rs. Without the secret there is no release: unsigned files
      # would never be installed by the app anyway.
      - name: Sign release files
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::secret UPDATE_SIGNING_KEY is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          ver="${GITHUB_REF_NAME#v}"
          msg="$RUNNER_TEMP/signed-message"
          # The signed message is "tonearm-update-v1\n<version>\n<file name>\n" + the file
          # (crates/core/src/update.rs, signed_message): a signature is only valid for this
          # version and this file name, so old builds cannot be re-served as new ones.
          for f in dist/*; do
            printf 'tonearm-update-v1\n%s\n%s\n' "$ver" "$(basename "$f")" > "$msg"
            cat "$f" >> "$msg"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$msg" -out "$f.sig"
            test "$(stat -c %s "$f.sig")" = 64
          done
          rm -f "$key" "$msg"
          ls -l dist
      # Release notes: the section of CHANGELOG.md for this version.
      - name: Release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${ver}"
            exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ### Установка

          - **Windows**: `tonearm-windows-x86_64.zip` или просто `tonearm-windows-x86_64.exe`.
          - **Arch Linux**: `sudo pacman -U tonearm-*.pkg.tar.zst`.
          - **Другой Linux**: `tonearm-linux-x86_64.tar.gz`.

          Файлы `.sig` — подписи для встроенного обновления, скачивать их не нужно.
          NOTES
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Tonearm ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
