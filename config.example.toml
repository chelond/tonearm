# Copy to the config directory as config.toml:
#   Linux:   ~/.config/tonearm/config.toml
#   Windows: %APPDATA%\tonearm\config\config.toml
# Tokens are never stored here: they live in the system keyring or, without one,
# in an encrypted file (~/.local/share/tonearm/secrets, mode 0600).
# The settings page writes this file too; unknown or broken values fall back to defaults.

[spotify]
# Own app from https://developer.spotify.com/dashboard for the Web API (PKCE, no secret).
# Use it when the shared client id hits "rate limited" (429). See README.
# Redirect URI to register: http://127.0.0.1:8898/login
client_id = ""

[audio]
bitrate = 320          # 96 | 160 | 320
normalisation = false
gapless = true         # preload the next track
device = ""            # empty = system default; names as in Settings → Audio output

[cache]
max_size_mb = 512      # covers; the settings page offers 128 | 256 | 512 | 1024

[ui]
notifications = true   # notify on track change while the window is in the background
theme = "graphite"     # graphite, midnight, oled, forest, sakura, synthwave, light, sand, or "file:<name>.toml"

[lastfm]
scrobble = true        # send plays to Last.fm once signed in (Settings → Last.fm)
# Own API account from https://www.last.fm/api/account/create instead of the one built into
# release builds. Leave empty to use the built-in one.
api_key = ""
api_secret = ""

[update]
check = true           # look for a new version at startup and once a day
# Release feed in the shape of GitHub's releases/latest JSON; empty = GitHub Releases.
# Lets you serve updates from your own server. Files must still carry the project's signature.
feed_url = ""
